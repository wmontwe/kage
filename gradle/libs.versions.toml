[versions]
junit = "6.1.3"
kotlin = "2.4.20"
pitest = "1.21.0"
pitest-junit5 = "1.2.3"

[libraries]
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
animalsniffer-signature-android = "com.toasttab.android:gummy-bears-api-26:0.15.0"
bouncycastle-bcprov = "org.bouncycastle:bcprov-jdk15to18:1.85.2"
hkdf = "at.favre.lib:hkdf:2.0.0"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinresult = "com.michael-bull.kotlin-result:kotlin-result:2.3.1"
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
pitest-kotlin = "com.arcmutate:pitest-kotlin-plugin:1.5.1"

[plugins]
animalsniffer = "ru.vyarus.animalsniffer:2.0.1"
dokka = "org.jetbrains.dokka:2.2.0"
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kover = "org.jetbrains.kotlinx.kover:0.9.9"
mavenPublish = "com.vanniktech.maven.publish.base:0.37.0"
pitest = "info.solidsoft.pitest:1.19.0"
spotless = "com.diffplug.spotless:8.10.2"
